<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Website Showcase</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --background: #ffffff;
      --foreground: #09090b;
      --card: #ffffff;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --input: #e4e4e7;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --ring: #a1a1aa;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .container {
      width: min(1440px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted-foreground);
      font-size: 14px;
    }

    .count {
      flex: 0 0 auto;
      color: var(--muted-foreground);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 0 16px;
    }

    .toolbar-spacer { flex: 1 1 auto; }

    .field-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted-foreground);
      font-size: 12px;
      white-space: nowrap;
    }

    .select {
      height: 40px;
      min-width: 112px;
      padding: 0 32px 0 12px;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      outline: none;
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgb(0 0 0 / 3%);
    }

    .select:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgb(161 161 170 / 20%);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .pagination[hidden] { display: none; }

    .pagination-info {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .pagination-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-button {
      display: inline-flex;
      min-width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--background);
      color: var(--foreground);
      font-size: 13px;
      cursor: pointer;
    }

    .page-button:hover:not(:disabled) { background: var(--muted); }
    .page-button[aria-current="page"] {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .page-button:disabled { opacity: .4; cursor: not-allowed; }
    .page-ellipsis { padding: 0 4px; color: var(--muted-foreground); }

    .search-wrap {
      position: relative;
      width: min(100%, 420px);
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search {
      display: block;
      width: 100%;
      height: 40px;
      padding: 0 12px 0 38px;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      outline: none;
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgb(0 0 0 / 3%);
      transition: border-color .15s, box-shadow .15s;
    }

    #search::placeholder { color: #a1a1aa; }

    #search:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgb(161 161 170 / 20%);
    }

    .letter-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 28px;
    }

    .letter-link {
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 600;
      transition: background .15s, color .15s, border-color .15s;
    }

    .letter-link:hover,
    .letter-link:focus-visible {
      background: var(--muted);
      border-color: #d4d4d8;
      color: var(--foreground);
      outline: none;
    }

    .letter-link.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .letter-group { margin: 0 0 36px; scroll-margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.025em;
    }

    .group-count {
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      transition: border-color .15s, box-shadow .15s;
    }

    .card:hover {
      border-color: #d4d4d8;
      box-shadow: 0 2px 8px rgb(0 0 0 / 4%);
    }

    .preview {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .no-image {
      display: grid;
      width: 100%;
      height: 100%;
      min-height: 140px;
      place-items: center;
      padding: 20px;
      color: var(--muted-foreground);
      font-size: 13px;
      text-align: center;
    }

    .details { padding: 16px; }

    .details h3 {
      overflow-wrap: anywhere;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.015em;
    }

    .tagline {
      margin: 6px 0 8px;
      color: var(--muted-foreground);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .url {
      display: block;
      overflow-wrap: anywhere;
      color: #52525b;
      font-size: 12px;
    }

    .url:hover { text-decoration: underline; text-underline-offset: 3px; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .button {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--background);
      color: var(--foreground);
      font-size: 12px;
      font-weight: 500;
      transition: background .15s;
    }

    .button:hover { background: var(--muted); }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button.primary:hover { background: #27272a; }

    .status {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .empty {
      padding: 48px 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted-foreground);
      text-align: center;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted-foreground);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .container { width: calc(100% - 28px); padding: 30px 0 44px; }
      .header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .toolbar { padding: 20px 0 16px; }
      .search-wrap { width: 100%; }
      .toolbar-spacer { display: none; }
      .field-label { flex: 1 1 calc(50% - 6px); justify-content: space-between; }
      .select { min-width: 0; flex: 1; }
      .group-grid { grid-template-columns: 1fr; gap: 14px; }
      .pagination { align-items: flex-start; flex-direction: column; }
      .pagination-actions { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">Website directory</p>
        <h1>Website Showcase</h1>
        <p class="subtitle">A collection of websites and their previews.</p>
      </div>
      <div id="count" class="count" aria-live="polite">Loading websites...</div>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input id="search" type="search" placeholder="Search name, tagline or URL..." aria-label="Search websites" autocomplete="off">
      </div>
      <span class="toolbar-spacer"></span>
      <label class="field-label" for="letter-filter">
        Starts with
        <select id="letter-filter" class="select" aria-label="Filter by first letter">
          <option value="ALL">All</option>
          <option value="#"># (Numbers / symbols)</option>
        </select>
      </label>
      <label class="field-label" for="page-size">
        Per page
        <select id="page-size" class="select" aria-label="Websites per page">
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="40">40</option>
        </select>
      </label>
    </div>

    <section id="grid" aria-live="polite">
      <div class="empty">Loading feed.json...</div>
    </section>
    <div id="pagination" class="pagination" aria-label="Website pagination" hidden></div>

    <footer>Website Showcase · Data loaded from feed.json</footer>
  </main>

  <script>
    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");
    const letterFilter = document.querySelector("#letter-filter");
    const pageSizeSelect = document.querySelector("#page-size");
    const pagination = document.querySelector("#pagination");

    let websites = [];
    let manifest = [];
    let currentPage = 1;

    function createElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function getGroupKey(name) {
      const firstChar = [...(name || "").trim()][0] || "";
      const upperChar = firstChar.toLocaleUpperCase();
      return /^[A-Z]$/.test(upperChar) ? upperChar : "#";
    }

    function getScreenshotPath(filename) {
      return "screenshot/" + String(filename)
        .replaceAll("\\", "/")
        .split("/")
        .map(encodeURIComponent)
        .join("/");
    }

    function createWebsiteCard(site, index) {
      const result = manifest[index];
      const card = createElement("article", "card");
      const preview = createElement("a", "preview");
      const siteName = site.name || site.url || "website";

      preview.href = site.url || "#";
      preview.target = "_blank";
      preview.rel = "noopener noreferrer";
      preview.setAttribute("aria-label", `Open ${siteName}`);

      if (result?.status === "success" && result.filename) {
        const img = document.createElement("img");
        img.src = getScreenshotPath(result.filename);
        img.alt = `Screenshot of ${siteName}`;
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => {
          preview.replaceChildren(createElement("div", "no-image", "Screenshot unavailable"));
          const status = card.querySelector(".status");
          if (status) status.textContent = "Screenshot file not found";
        }, { once: true });
        preview.append(img);
      } else {
        preview.append(createElement("div", "no-image",
          result?.status === "success" ? "Screenshot filename missing" : "Screenshot unavailable"));
      }

      const details = createElement("div", "details");
      details.append(createElement("h3", "", site.name || "Untitled website"));
      details.append(createElement("p", "tagline", site.tagline || "No tagline provided"));

      if (site.url) {
        const url = createElement("a", "url", site.url);
        url.href = site.url;
        url.target = "_blank";
        url.rel = "noopener noreferrer";
        details.append(url);
      }

      const actions = createElement("div", "actions");
      if (site.url) {
        const open = createElement("a", "button primary", "Visit website ↗");
        open.href = site.url;
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        actions.append(open);
      }

      const statusText = result?.status === "success" && result.filename
        ? "Screenshot ready"
        : result?.status ? `Screenshot: ${result.status}` : "No screenshot data";
      actions.append(createElement("span", "status", statusText));
      details.append(actions);
      card.append(preview, details);
      return card;
    }

    function renderPagination(totalItems, pageSize, totalPages, start, end) {
      pagination.replaceChildren();
      pagination.hidden = totalItems === 0;

      const info = createElement("span", "pagination-info",
        `Showing ${start + 1}–${end} of ${totalItems} websites`);
      const actions = createElement("div", "pagination-actions");

      const addButton = (label, page, options = {}) => {
        const button = createElement("button", "page-button", label);
        button.type = "button";
        button.disabled = Boolean(options.disabled);
        if (options.current) button.setAttribute("aria-current", "page");
        button.setAttribute("aria-label", options.ariaLabel || `Page ${page}`);
        button.addEventListener("click", () => {
          currentPage = page;
          render();
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        actions.append(button);
      };

      addButton("Previous", Math.max(1, currentPage - 1), {
        disabled: currentPage <= 1,
        ariaLabel: "Previous page"
      });

      // Show a compact range of page numbers around the current page.
      let pageNumbers = new Set([1, totalPages, currentPage - 1, currentPage, currentPage + 1]);
      pageNumbers = [...pageNumbers].filter(page => page >= 1 && page <= totalPages).sort((a, b) => a - b);
      let previousPage = 0;
      for (const page of pageNumbers) {
        if (previousPage && page - previousPage > 1) {
          actions.append(createElement("span", "page-ellipsis", "…"));
        }
        addButton(String(page), page, { current: page === currentPage });
        previousPage = page;
      }

      addButton("Next", Math.min(totalPages, currentPage + 1), {
        disabled: currentPage >= totalPages,
        ariaLabel: "Next page"
      });

      pagination.append(info, actions);
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const selectedLetter = letterFilter.value;
      const pageSize = Number(pageSizeSelect.value) || 20;

      const filtered = websites
        .map((site, index) => ({ site, index }))
        .filter(({ site }) => {
          const text = [site.name, site.tagline, site.url]
            .filter(Boolean).join(" ").toLocaleLowerCase();
          const matchesSearch = text.includes(query);
          const matchesLetter = selectedLetter === "ALL" || getGroupKey(site.name) === selectedLetter;
          return matchesSearch && matchesLetter;
        });

      count.textContent = `${filtered.length} website${filtered.length === 1 ? "" : "s"}`;
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * pageSize;
      const pageItems = filtered.slice(start, start + pageSize);
      grid.replaceChildren();

      if (!filtered.length) {
        grid.append(createElement("div", "empty", "No websites found."));
        pagination.hidden = true;
        pagination.replaceChildren();
        return;
      }

      // Group only the current page, keeping the alphabetical sections.
      const groups = new Map();
      for (const item of pageItems) {
        const key = getGroupKey(item.site.name);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      const keys = [...groups.keys()].sort((a, b) => {
        if (a === "#") return 1;
        if (b === "#") return -1;
        return a.localeCompare(b);
      });

      for (const key of keys) {
        const items = groups.get(key);
        const section = createElement("section", "letter-group");
        section.id = `group-${key}`;
        const heading = createElement("h2", "group-heading");
        heading.append(document.createTextNode(key), createElement(
          "span", "group-count", `${items.length} website${items.length === 1 ? "" : "s"}`));
        const cards = createElement("div", "group-grid");
        for (const { site, index } of items) cards.append(createWebsiteCard(site, index));
        section.append(heading, cards);
        grid.append(section);
      }

      renderPagination(filtered.length, pageSize, totalPages, start, Math.min(start + pageSize, filtered.length));
    }

    function populateLetterFilter() {
      for (const letter of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
        const option = createElement("option", "", letter);
        option.value = letter;
        letterFilter.append(option);
      }
    }

    async function init() {
      try {
        const [feedResponse, manifestResponse] = await Promise.all([
          fetch("feed.json"),
          fetch("screenshot-manifest.json").catch(() => null)
        ]);

        if (!feedResponse.ok) {
          throw new Error(`Could not load feed.json (HTTP ${feedResponse.status})`);
        }

        websites = await feedResponse.json();
        if (!Array.isArray(websites)) {
          throw new Error("feed.json must contain a JSON array");
        }

        if (manifestResponse?.ok) {
          const data = await manifestResponse.json();
          manifest = Array.isArray(data) ? data : [];
        } else {
          manifest = [];
        }

        populateLetterFilter();
        render();
      } catch (error) {
        count.textContent = "Unable to load";
        letterNav.replaceChildren();
        grid.replaceChildren(createElement(
          "div", "empty",
          `${error.message}. Serve this directory over HTTP/HTTPS.`
        ));
      }
    }

    search.addEventListener("input", () => {
      currentPage = 1;
      render();
    });
    letterFilter.addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    pageSizeSelect.addEventListener("change", () => {
      currentPage = 1;
      render();
    });
    init();
  </script>
</body>
</html>
