<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Website Showcase</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #171c2a 0, #0b0d12 55%);
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1600px, calc(100% - 40px));
      margin: auto;
      padding: 56px 0 72px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 32px;
    }

    .eyebrow {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -.04em;
    }

    .subtitle { color: #9ca3af; margin: 0; }

    .count {
      white-space: nowrap;
      color: #c4b5fd;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 13px 16px;
      color: #f9fafb;
      background: #151923;
      border: 1px solid #2b3140;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    input:focus { border-color: #8b7cf6; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      background: #12151d;
      border: 1px solid #282d39;
      border-radius: 16px;
      transition: border-color .2s, transform .2s;
    }

    .card:hover {
      border-color: #656080;
      transform: translateY(-2px);
    }

    .preview {
      display: block;
      position: relative;
      aspect-ratio: 16 / 9;
      background: #1b202b;
      overflow: hidden;
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .no-image {
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 140px;
      padding: 20px;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }

    .details { padding: 18px; }

    .details h2 {
      margin: 0;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .tagline {
      margin: 8px 0;
      color: #a5aab7;
      font-size: 14px;
    }

    .url {
      display: block;
      color: #a5b4fc;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid #373d4d;
      border-radius: 9px;
      font-size: 13px;
    }

    .button.primary {
      background: #c4b5fd;
      border-color: #c4b5fd;
      color: #171324;
      font-weight: 700;
    }

    .status { color: #9ca3af; font-size: 12px; }

    .empty {
      grid-column: 1 / -1;
      padding: 48px 20px;
      text-align: center;
      color: #9ca3af;
      border: 1px dashed #373d4d;
      border-radius: 16px;
    }

    footer {
      margin-top: 32px;
      color: #717887;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .container {
        width: min(100% - 24px, 560px);
        padding-top: 32px;
      }

      header { align-items: start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <div class="eyebrow">Website directory</div>
        <h1>Website Showcase</h1>
        <p class="subtitle">A collection of websites and their previews.</p>
      </div>
      <div id="count" class="count">Loading websites...</div>
    </header>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search name, tagline or URL..."
        aria-label="Search websites"
      >
    </div>

    <section id="grid" class="grid" aria-live="polite">
      <div class="empty">Loading feed.json...</div>
    </section>

    <footer>Website Showcase · Data loaded from feed.json</footer>
  </main>

  <script>
    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");

    let websites = [];
    let manifest = [];

    function createElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function render() {
      const query = search.value.trim().toLowerCase();

      const filtered = websites
        .map((site, index) => ({ site, index }))
        .filter(({ site }) => {
          const text = [
            site.name, site.tagline, site.url
          ].join(" ").toLowerCase();

          return text.includes(query);
        });

      count.textContent =
        `${filtered.length} website${filtered.length === 1 ? "" : "s"}`;

      grid.replaceChildren();

      if (!filtered.length) {
        grid.append(createElement(
          "div", "empty", "No websites found."
        ));
        return;
      }

      for (const { site, index } of filtered) {
        const card = createElement("article", "card");
        const result = manifest[index];
        const preview = createElement("a", "preview");
        preview.href = site.url || "#";
        preview.target = "_blank";
        preview.rel = "noopener noreferrer";
        preview.setAttribute(
          "aria-label", `Open ${site.name || site.url || "website"}`
        );

        if (result?.status === "success" && result.filename) {
          const img = document.createElement("img");
          img.src = `screenshot/${encodeURIComponent(result.filename)
            .replaceAll("%2F", "/")}`;
          img.alt = `Screenshot of ${site.name || site.url || "website"}`;
          img.loading = "lazy";

          img.addEventListener("error", () => {
            preview.replaceChildren(
              createElement("div", "no-image", "Screenshot unavailable")
            );
          }, { once: true });

          preview.append(img);
        } else {
          preview.append(createElement(
            "div", "no-image", "Screenshot unavailable"
          ));
        }

        const details = createElement("div", "details");
        details.append(createElement(
          "h2", "", site.name || "Untitled website"
        ));
        details.append(createElement(
          "p", "tagline", site.tagline || "No tagline provided"
        ));

        const url = createElement("a", "url", site.url || "");
        url.href = site.url || "#";
        url.target = "_blank";
        url.rel = "noopener noreferrer";
        details.append(url);

        const actions = createElement("div", "actions");

        const open = createElement("a", "button primary", "Visit website ↗");
        open.href = site.url || "#";
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        actions.append(open);

        const statusText = result?.status === "success"
          ? "Screenshot ready"
          : "No screenshot";

        actions.append(createElement("span", "status", statusText));
        details.append(actions);

        card.append(preview, details);
        grid.append(card);
      }
    }

    async function init() {
      try {
        const [feedResponse, manifestResponse] = await Promise.all([
          fetch("feed.json"),
          fetch("screenshot-manifest.json")
        ]);

        if (!feedResponse.ok) {
          throw new Error("Could not load feed.json");
        }

        websites = await feedResponse.json();

        if (!Array.isArray(websites)) {
          throw new Error("feed.json must contain a JSON array");
        }

        manifest = manifestResponse.ok
          ? await manifestResponse.json()
          : [];

        render();
      } catch (error) {
        count.textContent = "Unable to load";
        grid.replaceChildren(createElement(
          "div", "empty",
          `${error.message}. Serve this directory over HTTP/HTTPS.`
        ));
      }
    }

    search.addEventListener("input", render);
    init();
  </script>
</body>
</html>
